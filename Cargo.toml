[package]
name = "stonktop"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
authors = ["Thomas Vincent <thomasvincent@gmail.com>"]
description = "A top-like terminal UI for monitoring stock and cryptocurrency prices"
documentation = "https://docs.rs/stonktop"
homepage = "https://github.com/somethingwithproof/stonktop"
repository = "https://github.com/somethingwithproof/stonktop"
license = "MIT"
keywords = ["stocks", "cryptocurrency", "terminal", "tui", "finance"]
categories = ["command-line-utilities", "finance"]
readme = "README.md"
include = [
    "src/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1.0"
dirs = "6.0"
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
num-format = "0.4"
notify-rust = "=4.18.0"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[[bin]]
name = "stonktop"
path = "src/main.rs"

[lib]
name = "stonktop"
path = "src/lib.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/stonktop-{ target }.tar.gz"
bin-dir = "stonktop-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
